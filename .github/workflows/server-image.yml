name: Build server image

# Manual only: Actions -> "Build server image" -> Run workflow.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to publish (e.g. 0.4.0-rc-6-7z, or latest)"
        required: true
        default: "latest"
        type: string
      also_latest:
        description: "Also tag this build as :latest"
        required: true
        default: true
        type: boolean
      push:
        description: "Push to GHCR (uncheck to only build and export a tarball artifact)"
        required: true
        default: true
        type: boolean
      platforms:
        description: "Target platform(s)"
        required: true
        default: "linux/amd64"
        type: choice
        options:
          - linux/amd64
          - linux/amd64,linux/arm64

concurrency:
  group: server-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    name: Build ${{ inputs.tag }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out the repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve tags
        id: tags
        run: |
          # GHCR paths must be lowercase; the repo owner may contain capitals
          IMAGE_LC="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          VERSION="$(jq -r '.version' server/package.json)"
          TAG='${{ inputs.tag }}'

          if [ -z "$TAG" ]; then
            echo "::error::the tag input is empty"
            exit 1
          fi

          TAGS="${IMAGE_LC}:${TAG}"
          if [ '${{ inputs.also_latest }}' = "true" ] && [ "$TAG" != "latest" ]; then
            TAGS="${TAGS}"$'\n'"${IMAGE_LC}:latest"
          fi

          {
            echo "image=${IMAGE_LC}"
            echo "tags<<EOF"
            echo "$TAGS"
            echo "EOF"
            echo "build_version=v${VERSION}"
            echo "single_platform=true"
          } >> "$GITHUB_OUTPUT"

          case '${{ inputs.platforms }}' in
            *,*) sed -i 's/^single_platform=true$/single_platform=false/' "$GITHUB_OUTPUT" ;;
          esac

          echo "Will publish:"
          echo "$TAGS"

      - name: Log in to GHCR
        if: ${{ inputs.push }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        if: contains(inputs.platforms, 'arm64')
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      # Single-platform + no push => load into the local daemon so it can be saved
      # as an artifact. Everything else goes straight to the registry.
      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ inputs.platforms }}
          push: ${{ inputs.push }}
          load: ${{ !inputs.push && steps.tags.outputs.single_platform == 'true' }}
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ inputs.tag }}
            org.opencontainers.image.title=drop
            org.opencontainers.image.description=Drop game server, archive versions read via the 7z CLI
          build-args: |
            BUILD_DROP_VERSION=${{ steps.tags.outputs.build_version }}
            BUILD_GIT_REF=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # attestations only exist for registry exports, so skip them when the
          # build is only loaded into the local daemon
          provenance: ${{ inputs.push && 'mode=max' || 'false' }}
          sbom: ${{ inputs.push }}

      - name: Export image tarball
        if: ${{ !inputs.push && steps.tags.outputs.single_platform == 'true' }}
        run: |
          docker save '${{ steps.tags.outputs.image }}:${{ inputs.tag }}' \
            | gzip -1 > /tmp/drop-image.tar.gz
          ls -lh /tmp/drop-image.tar.gz

      - name: Upload image tarball
        if: ${{ !inputs.push && steps.tags.outputs.single_platform == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: drop-image-${{ inputs.tag }}
          path: /tmp/drop-image.tar.gz
          retention-days: 14
          if-no-files-found: error

      - name: Summary
        run: |
          {
            echo "### Drop server image"
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| Tag input | \`${{ inputs.tag }}\` |"
            echo "| Tags | \`$(echo '${{ steps.tags.outputs.tags }}' | tr '\n' ' ')\` |"
            echo "| Platforms | \`${{ inputs.platforms }}\` |"
            echo "| Pushed to GHCR | \`${{ inputs.push }}\` |"
            echo "| Digest | \`${{ steps.build.outputs.digest }}\` |"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo
            if [ '${{ inputs.push }}' = "true" ]; then
              echo '```bash'
              echo "docker pull $(echo '${{ steps.tags.outputs.tags }}' | head -1)"
              echo '```'
            else
              echo "Image saved as the \`drop-image-${{ inputs.tag }}\` artifact."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
