name: Droplet CI

on:
  push:
    branches: [develop]
    paths:
      - "libraries/droplet/**"
      - "libraries/droplet_types/**"
      - "libraries/libarchive/**"
      - ".github/workflows/droplet-ci.yml"
  pull_request:
    branches: [develop]
    paths:
      - "libraries/droplet/**"
      - "libraries/droplet_types/**"
      - "libraries/libarchive/**"
      - ".github/workflows/droplet-ci.yml"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    name: Build, Test, Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: libraries/droplet
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./libraries/droplet -> target"

      # the archive backend shells out to the 7z CLI, so the runner needs one
      - name: Install 7-Zip
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full
          7z i | head -2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy (lint)
        run: cargo clippy --all-targets --all-features -- -D warnings

      # archive_compat drives the archive backend end to end (7z l / 7z x -so),
      # so it also proves the CLI is reachable from the test environment
      - name: Run tests
        run: cargo test --all-features --all --verbose
