name: Build server image

# Manual only: Actions -> "Build server image" -> Run workflow.
#
# Tagging, three modes:
#   upstream-version : use the git tag (v0.4.0-rc-6, or v0.4.0-rc-6-d7144046 when
#                      HEAD is ahead of the tag). This is the default.
#   latest           : publish :latest only
#   custom           : use whatever you type in custom_tag
# "Also tag :latest" additionally pushes :latest next to the version tag.
on:
  workflow_dispatch:
    inputs:
      tag_mode:
        description: "How to name the image"
        required: true
        default: upstream-version
        type: choice
        options:
          - upstream-version
          - latest
          - custom
      custom_tag:
        description: "Custom tag (only used when tag_mode = custom)"
        required: false
        default: ""
        type: string
      also_latest:
        description: "Also push :latest alongside the version tag"
        required: true
        default: true
        type: boolean
      push:
        description: "Push to GHCR (uncheck to only build and download a tarball artifact)"
        required: true
        default: true
        type: boolean
      platforms:
        description: "Target platform(s)"
        required: true
        default: "linux/amd64"
        type: choice
        options:
          - linux/amd64
          - linux/amd64,linux/arm64

concurrency:
  group: server-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    name: Build server image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out the repo
        uses: actions/checkout@v7
        with:
          # full history + tags: the version tag is derived from them
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve tags
        id: tags
        run: |
          set -euo pipefail

          # GHCR paths must be lowercase; the owner may contain capitals
          IMAGE="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"

          # version the app reports (nuxt BUILD_DROP_VERSION), from upstream's package.json
          APP_VERSION="$(jq -r '.version' server/package.json)"

          MODE='${{ inputs.tag_mode }}'
          CUSTOM='${{ inputs.custom_tag }}'

          case "$MODE" in
            latest)
              TAG="latest"
              ;;
            custom)
              if [ -z "$CUSTOM" ]; then
                echo "::error::tag_mode=custom needs a custom_tag"
                exit 1
              fi
              TAG="$CUSTOM"
              ;;
            upstream-version)
              # exact tag on HEAD -> that tag; otherwise nearest tag + short sha,
              # so two builds of different commits can never collide
              if EXACT="$(git describe --tags --exact-match 2>/dev/null)"; then
                TAG="$EXACT"
              else
                NEAREST="$(git describe --tags --abbrev=0 2>/dev/null || echo "v${APP_VERSION}")"
                SHORT="$(git rev-parse --short=8 HEAD)"
                TAG="${NEAREST}-${SHORT}"
              fi
              ;;
            *)
              echo "::error::unknown tag_mode '$MODE'"
              exit 1
              ;;
          esac

          # docker tags: [A-Za-z0-9_.-], max 128 chars, must not start with '.' or '-'
          TAG="$(echo "$TAG" | sed -E 's/[^A-Za-z0-9_.-]+/-/g; s/^[.-]+//' | cut -c1-128)"
          if [ -z "$TAG" ]; then
            echo "::error::resolved tag is empty after sanitising"
            exit 1
          fi

          TAGS="${IMAGE}:${TAG}"
          if [ '${{ inputs.also_latest }}' = "true" ] && [ "$TAG" != "latest" ]; then
            TAGS="${TAGS}"$'\n'"${IMAGE}:latest"
          fi

          SINGLE=true
          case '${{ inputs.platforms }}' in
            *,*) SINGLE=false ;;
          esac

          {
            echo "image=${IMAGE}"
            echo "version_tag=${TAG}"
            echo "app_version=v${APP_VERSION}"
            echo "single_platform=${SINGLE}"
            echo "tags<<EOF"
            echo "$TAGS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          echo "App version : v${APP_VERSION}"
          echo "Image tags  :"
          echo "$TAGS" | sed 's/^/  /'

      - name: Log in to GHCR
        if: ${{ inputs.push }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        if: contains(inputs.platforms, 'arm64')
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      # Single-platform + no push => load into the local daemon so it can be saved
      # as an artifact. Everything else goes straight to the registry.
      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ inputs.platforms }}
          push: ${{ inputs.push }}
          load: ${{ !inputs.push && steps.tags.outputs.single_platform == 'true' }}
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.tags.outputs.version_tag }}
            org.opencontainers.image.title=drop
            org.opencontainers.image.description=Drop game server, archive versions read via the 7z CLI
          build-args: |
            BUILD_DROP_VERSION=${{ steps.tags.outputs.app_version }}
            BUILD_GIT_REF=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # attestations only exist for registry exports
          provenance: ${{ inputs.push && 'mode=max' || 'false' }}
          sbom: ${{ inputs.push }}

      - name: Export image tarball
        if: ${{ !inputs.push && steps.tags.outputs.single_platform == 'true' }}
        run: |
          docker save '${{ steps.tags.outputs.image }}:${{ steps.tags.outputs.version_tag }}' \
            | gzip -1 > /tmp/drop-image.tar.gz
          ls -lh /tmp/drop-image.tar.gz

      - name: Upload image tarball
        if: ${{ !inputs.push && steps.tags.outputs.single_platform == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: drop-image-${{ steps.tags.outputs.version_tag }}
          path: /tmp/drop-image.tar.gz
          retention-days: 14
          if-no-files-found: error

      - name: Summary
        run: |
          {
            echo "### Drop server image"
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| Tag mode | \`${{ inputs.tag_mode }}\` |"
            echo "| Version tag | \`${{ steps.tags.outputs.version_tag }}\` |"
            echo "| App version | \`${{ steps.tags.outputs.app_version }}\` |"
            echo "| Published tags | \`$(echo '${{ steps.tags.outputs.tags }}' | tr '\n' ' ')\` |"
            echo "| Platforms | \`${{ inputs.platforms }}\` |"
            echo "| Pushed | \`${{ inputs.push }}\` |"
            echo "| Digest | \`${{ steps.build.outputs.digest }}\` |"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo
            if [ '${{ inputs.push }}' = "true" ]; then
              echo '```bash'
              echo "docker pull $(echo '${{ steps.tags.outputs.tags }}' | head -1)"
              echo '```'
            else
              echo "Image saved as the \`drop-image-${{ steps.tags.outputs.version_tag }}\` artifact."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
